<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Config Bot</title>
  <style>
    body{font-family:'Segoe UI',Arial;background:#0f172a;color:white;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;}
    .card{background:#1e293b;padding:30px;border-radius:20px;box-shadow:0 0 20px rgba(37,211,102,0.3);text-align:center;width:90%;max-width:400px;}
    .btn{background:linear-gradient(45deg,#25D366,#128C7E);color:white;padding:18px;width:100%;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;transition:0.3s;margin-top:15px;}
    .btn:hover{transform:scale(1.05);}
    select, input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#334155;color:white;font-size:16px;box-sizing:border-box;}
  </style>
</head>
<body>
  <div class="card">
    <h1>🔥 PANEL CONFIG</h1>
    <p>Bot WA: 6285725860972</p>
    
    <select id="tipe">
      <option value="vless">VLESS</option>
      <option value="ssh">SSH</option>
      <option value="vmess">VMESS</option>
      <option value="trojan">TROJAN</option>
    </select>
    
    <input type="text" id="nama" placeholder="Masukkan Nama User">
    <input type="number" id="exp" placeholder="Masa Aktif Hari" value="30">
    
    <button class="btn" onclick="buatConfig()">1 KLIK BUAT CONFIG</button>
  </div>

<script>
function buatConfig(){
  let tipe = document.getElementById('tipe').value;
  let nama = document.getElementById('nama').value;
  let exp = document.getElementById('exp').value;
  let nomerBot = "6285725860972";
  
  if(!nama){alert("Isi nama dulu!"); return;}
  
  let pesan = `!config ${tipe} ${nama} ${exp}`;
  window.open(`https://wa.me/${nomerBot}?text=${encodeURIComponent(pesan)}`, '_blank');
}
</script>
</body>
</html>
