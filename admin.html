<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Lana Jahat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family: 'Poppins', sans-serif;
    background: #050510;
    color:#e5e5e5;
    min-height:100vh;
    display:flex;justify-content:center;align-items:center;
    background: radial-gradient(circle at 80% 80%, #1e1b4b 0%, #050510 50%);
  }
  .card{
    background: rgba(20,20,30,0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(34,197,94,0.4);
    padding: 40px 30px;
    border-radius: 25px;
    text-align: center;
    max-width: 400px;width: 90%;
    box-shadow: 0 0 40px rgba(34,197,94,0.2);
  }
  h1{font-size:24px;font-weight:700;color:#4ade80;margin-bottom:10px}
  p{color:#9ca3af;font-size:14px;margin-bottom:25px}
  .btn{
    display:block;background:linear-gradient(90deg,#22c55e,#16a34a);
    color:white;text-decoration:none;padding:14px;
    border-radius:14px;font-weight:600;margin:12px 0;
    transition:0.3s;
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(34,197,94,0.4)}
  .btn-back{background:linear-gradient(90deg,#8b5cf6,#6366f1)}
</style>
</head>
<body>
  <div class="card">

  </div>
</body>
</html>
